name: Release

# Publishes to PyPI when a GitHub Release is published (e.g. via
# `gh release create vX.Y.Z`). Uses PyPI Trusted Publishing (OIDC) — no API
# token secret is stored in the repo.
#
# ONE-TIME SETUP (required before the first release, otherwise the publish
# step fails):
#   1. On PyPI: project "issuedb" -> Settings -> Publishing -> add a
#      "trusted publisher" with:
#        Owner:            rodmena-limited
#        Repository:       issue-queue
#        Workflow name:    release.yml
#        Environment name: pypi
#   2. On GitHub: repo -> Settings -> Environments -> create an environment
#      named "pypi" (optionally add required reviewers to gate publishes).

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  # Re-run the full quality gate before shipping, so a release can never
  # publish a red build.
  verify:
    name: verify (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.9", "3.14"]   # floor and ceiling of supported range
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[web]" pytest
      - run: python -m pytest -q

  build:
    name: build distribution
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
      - name: Check that the built version matches the release tag
        run: |
          python -m pip install -e .
          pkg_ver="$(python -c 'import importlib.metadata as m; print(m.version("issuedb"))')"
          tag="${GITHUB_REF_NAME#v}"
          echo "package version: $pkg_ver   release tag: $tag"
          if [ "$pkg_ver" != "$tag" ]; then
            echo "::error::pyproject version ($pkg_ver) does not match release tag ($tag)"
            exit 1
          fi
      - name: Verify distribution metadata
        run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
          if-no-files-found: error

  publish:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write        # required for OIDC Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
